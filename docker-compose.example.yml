name: gluetun-webui

# ============================================================================
# OPTION A1: Single Instance (Recommended)
# Point this webui to a single gluetun container on the same network
# ============================================================================

services:
  gluetun-webui:
    image: scuzza/gluetun-webui:latest
    container_name: gluetun-webui
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GLUETUN_CONTROL_URL=http://gluetun:8000
      # --- Gluetun control-server auth (only if enabled) ---
      #- GLUETUN_API_KEY=yourtoken
      #- GLUETUN_USER=username
      #- GLUETUN_PASSWORD=password
      # --- Provider cards and forwarded port ---
      #- AIRVPN_API_KEY=yourkey
      #- FORWARDED_PORT=42562
      #- MULLVAD_ACCOUNT_NUMBER=0000000000000000
      #- SURFSHARK_USER=you@example.com
      #- SURFSHARK_PASSWORD=yourpassword
      #- PROTONVPN_USER=you@example.com
      #- PROTONVPN_PASSWORD=yourpassword
      # --- Web UI login ---
      #- WEBUI_USER=admin
      #- WEBUI_PASSWORD=change-me
      # --- Speed test ---
      #- SPEEDTEST_ENABLED=true
      #- SPEEDTEST_HISTORY_FILE=/data/speedtest-history.json
      # --- Polling and charts ---
      # Default polling interval in milliseconds (0, 5000, 10000, 30000, 60000)
      #- DEFAULT_POLL_INTERVAL=10000
      # Latency chart is on by default; set to false to disable
      #- LATENCY_CHART=false
      # Latency chart renderer: 'svg' (default) or 'plotly'
      #- LATENCY_CHART_RENDERER=svg
      # --- Reverse proxy / remote access ---
      #- ALLOWED_HOSTS=vpn.example.com
      # Set to 'true' if behind a reverse proxy (nginx, Traefik, etc.)
      #- TRUST_PROXY=true
    
    networks:
      - gluetun-stack
    restart: unless-stopped
    read_only: true
    volumes:
      - gluetun-webui-data:/data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.50"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
networks:
  gluetun-stack:
    driver: bridge

volumes:
  gluetun-webui-data:

